<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
window.addEventListener('load', function () {
  var langLink = document.getElementById('lang-toggle');
  if (!langLink) return;

  var path = window.location.pathname;

  // Map each English path to its Lithuanian equivalent
  var ltVersions = {
    '/':          '/lt/',
    '/cv/':       '/lt/cv/',
    '/resume/':   '/lt/cv/',
    '/teaching/': '/lt/teaching/'
  };

  if (path.startsWith('/lt')) {
    // On a Lithuanian page — strip /lt prefix to get the English path
    var enPath = path.replace(/^\/lt/, '') || '/';
    langLink.setAttribute('href', enPath);
    langLink.textContent = '🇬🇧 English';
  } else {
    // On an English page — look up the Lithuanian equivalent
    var ltPath = ltVersions[path] || '/lt/';
    langLink.setAttribute('href', ltPath);
    langLink.textContent = '🇱🇹 Lietuviškai';
  }
});
</script>

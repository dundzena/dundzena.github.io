<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
(function () {
  var btn = document.getElementById('lang-toggle');
  if (!btn) return;

  var path = window.location.pathname;

  // Map each English path to its Lithuanian equivalent
  var ltMap = {
    '/':          '/lt/',
    '/cv/':       '/lt/cv/',
    '/resume/':   '/lt/cv/',
    '/teaching/': '/lt/teaching/'
  };

  if (path.startsWith('/lt')) {
    // On a Lithuanian page — link back to the English equivalent
    var enPath = path.replace(/^\/lt/, '') || '/';
    btn.setAttribute('href', enPath);
    btn.textContent = '🇱🇹 Lietuviškai';
  } else {
    // On an English page — link to the Lithuanian equivalent
    btn.setAttribute('href', ltMap[path] || '/lt/');
    btn.textContent = '🇬🇧 English';
  }
})();
</script>

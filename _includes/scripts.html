<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
(function () {
  var langLink = document.querySelector('.greedy-nav a[href*="lang-switch"]');
  if (!langLink) return;

  var path = window.location.pathname;

  // Map English paths to their Lithuanian equivalents
  var ltVersions = {
    '/':          '/lt/',
    '/cv/':       '/lt/cv/',
    '/resume/':   '/lt/cv/',
    '/teaching/': '/lt/teaching/'
  };

  if (path.startsWith('/lt')) {
    // On a Lithuanian page — offer English
    var enPath = path.replace(/^\/lt/, '') || '/';
    langLink.setAttribute('href', enPath);
    langLink.textContent = '🇬🇧 English';
  } else {
    // On an English page — offer Lithuanian
    var ltPath = ltVersions[path] || '/lt/';
    langLink.setAttribute('href', ltPath);
    langLink.textContent = '🇱🇹 Lietuviškai';
  }
})();
</script>
